<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FLL Live Rankings</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #111827;
    }

    #board {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      margin-bottom: 10px;
      background: #1f2937;
      border-radius: 10px;
      gap: 15px;
    }

    .rank {
      width: 50px;
      font-weight: bold;
      color: #60a5fa;
      font-size: 18px;
    }

    .team {
      width: 220px;
      font-weight: bold;
    }

    .runs {
      flex: 1;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .run {
      padding: 6px 10px;
      border-radius: 8px;
      background: #374151;
      min-width: 70px;
      text-align: center;
      font-size: 14px;
    }

    .best {
      background: #facc15;
      color: #111827;
      font-weight: bold;
      transform: scale(1.05);
    }

    .score {
      width: 80px;
      text-align: right;
      font-weight: bold;
      color: #34d399;
      font-size: 18px;
    }

    .first {
      background: #2563eb;
    }

  </style>
</head>

<body>

<h1>🏆 Live Rankings</h1>

<div id="board"></div>

<script>

async function loadBoard() {

  const res = await fetch("/api/runs/rankings");
  const data = await res.json();

  render(data);

}

function render(data) {

  const board = document.getElementById("board");
  board.innerHTML = "";

  data.forEach((team, index) => {

    const best = team.bestScore;

    const row = document.createElement("div");
    row.className = "row";

    if (index === 0) {
      row.classList.add("first");
    }

    const runsHTML = [1,2,3].map(r => {

      const run = team.runs.find(x => x.round == r);

      const score = run ? run.score : "—";

      const isBest = run && run.score === best;

      return `
        <div class="run ${isBest ? "best" : ""}">
          R${r}<br>${score}
        </div>
      `;

    }).join("");

    row.innerHTML = `
      <div class="rank">${index + 1}</div>

      <div class="team">
        ${team.teamNumber} - ${team.name}
      </div>

      <div class="runs">
        ${runsHTML}
      </div>

      <div class="score">
        ${best}
      </div>
    `;

    board.appendChild(row);

  });

}

setInterval(loadBoard, 2000);
loadBoard();

</script>

</body>
</html>
